name: E2E public (Playwright)

on:
  push:
    branches: [ main ]
    paths: [ 'web/**', 'e2e/**' ]
  workflow_dispatch: {}

jobs:
  e2e-public:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: e2e } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - name: Wait for Netlify publish
        run: sleep 60
      - name: Run PUBLIC specs against live site
        env: { BASE_URL: 'https://trustnetsocial.netlify.app', CI: 'true' }
        run: npx playwright test tests/01-public.spec.js --project=chromium
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
