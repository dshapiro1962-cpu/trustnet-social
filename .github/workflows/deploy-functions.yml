# Deploys Supabase edge functions automatically when their code changes.
# Requires one repo secret: SUPABASE_ACCESS_TOKEN
name: Deploy Supabase functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch: {}   # also allows manual runs from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: kgsdtfrcyjrxeyqqxoic
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all functions
        run: |
          set -e
          # Functions that must accept unauthenticated calls.
          #
          # THIS LIST WAS WRONG AND WOULD HAVE BROKEN ANSWERING (fixed 13 Sep).
          # Production has had receive-response and response-meta on
          # verify_jwt=false since they were written - respond.html is
          # account-free by design - but they were missing here, so the first
          # run of this workflow would have redeployed them WITH verification
          # and killed the answer loop outright: no one could load a question
          # or send an answer. build-sheet was missing for the same reason.
          # Checked against `supabase functions list` on 13 Sep 2026.
          #
          #   whatsapp-webhook  Meta calls it
          #   get-collection    public shared lists
          #   response-meta     respond.html loads the question with a token
          #   receive-response  respond.html sends the answer with a token
          #   build-sheet       the answer sheet
          #   ingest-link       the Fetch box in respond.html; it authenticates
          #                     a user JWT *or* an unused response token itself
          NO_JWT="whatsapp-webhook get-collection response-meta receive-response build-sheet ingest-link"
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            [ "$fn" = "_shared" ] && continue
            if echo " $NO_JWT " | grep -q " $fn "; then
              echo "== deploying $fn (no-verify-jwt) =="
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
            else
              echo "== deploying $fn =="
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
            fi
          done
