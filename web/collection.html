<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The list is for the people given the link, not for search. It carries
     tradespeople's working numbers; the group they came from is private. -->
<meta name="robots" content="noindex, nofollow">
<title>Trustnet — Shared list</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#1B4FC4">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14357C">
<style>
/* THEME:START
   ═══════════════════════════════════════════════════════════════════════
   THE THEME. EVERY COLOUR AND FONT IN THE PRODUCT COMES FROM THIS BLOCK.

   To change the look: change the values here, in web/index.html, and nowhere
   else. Then run  node tools/sync-theme.js  which copies this block into the
   other pages. theme-sim.js fails if a colour is written anywhere outside it.

   Names say what a colour is FOR, never what it looks like: --accent, not
   --blue, so the next change of colour needs no renaming. Every colour has a
   day value in the first block and a night value in the second; night follows
   the phone's own setting.

   This is Riviera (dan, 2 Nov 2026): cobalt on a pale sky, coral on the +.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  color-scheme: light;

  /* the phone's own fonts: nothing to load, nothing to go missing */
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Menlo", "Courier New", monospace;

  /* the screen, and what sits on it */
  --ground: #E9F1FB;
  --surface: #FFFFFF;
  --field: #EEF3FA;
  --field-hover: #E2EAF6;
  --ink: #1C1C1E;
  --ink-2: #3A3F4B;
  --muted: #5A6272;
  --faint: #9AA4B5;
  --line: #DFE7F2;
  --line-strong: #C4D1E3;

  /* the one colour that means "press me" */
  --accent: #1B4FC4;
  --accent-hover: #163FA0;
  --accent-deep: #123A96;
  --accent-fg: #1B4FC4;
  --on-accent: #FFFFFF;
  --accent-soft: #DCE7F8;
  --accent-soft-fg: #1B4FC4;
  --accent-shadow: rgba(27,79,196,0.55);

  /* the colour across the top of Home */
  --band: #1B4FC4;
  --on-band: #FFFFFF;
  --band-fill: rgba(255,255,255,0.18);

  /* the + button */
  --fab: #E8553A;
  --on-fab: #FFFFFF;

  /* the side bar on a computer */
  --sidebar: #0F2D6B;
  --on-sidebar: #FFFFFF;
  --on-sidebar-2: #B8C8E8;
  --sidebar-fill: rgba(255,255,255,0.08);

  /* what floats: glass over the screen */
  --glass: rgba(255,255,255,0.62);
  --glass-edge: rgba(255,255,255,0.8);
  --glass-hi: rgba(255,255,255,0.95);
  --fill: rgba(120,120,128,0.14);
  --shadow: rgba(16,24,40,0.28);
  --scrim: rgba(10,14,22,0.42);

  /* saying something: errors, warnings, good news, a second voice */
  --danger: #B3261E;
  --on-danger: #FFFFFF;
  --danger-soft: #FDEDEB;
  --warn: #8A5A00;
  --warn-soft: #FFF3D6;
  --warn-line: #E8A020;
  --good: #0F7B6C;
  --good-soft: #DFF3EE;
  --violet: #5B3E9E;
  --violet-soft: #F3EEFB;

  /* a circle's colour, a person's colour, the question cards */
  --on-colour: #FFFFFF;
  --circle-1: #2470CC;
  --circle-2: #C9442A;
  --circle-3: #7A55D8;
  --circle-4: #0B7A8C;
  --circle-5: #C23B6E;
  --circle-6: #9E6512;
  --circle-7: #4A5FA8;
  --circle-8: #7C6A58;
  --card-1: #1B4FC4;
  --card-2: #C2462B;
  --card-3: #5F45B8;
  --card-4: #0E7489;

  /* the small coloured labels: words and their backgrounds */
  --tag-1: #97472A; --tag-1-soft: #F5E2D6;
  --tag-2: #1F4E8C; --tag-2-soft: #DCE8F8;
  --tag-3: #0E6B62; --tag-3-soft: #DDF1EE;
  --tag-4: #6E5A26; --tag-4-soft: #EDE6D4;
  --tag-5: #62427A; --tag-5-soft: #EAE1EF;
  --tag-6: #A32B56; --tag-6-soft: #FAEAF0;
  --tag-7: #3F4A68; --tag-7-soft: #E2E5EE;
  --tag-8: #5A6272; --tag-8-soft: #EDF0F5;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;

    --ground: #07122B;
    --surface: #101F42;
    --field: #182A54;
    --field-hover: #20356A;
    --ink: #F2F4F8;
    --ink-2: #D5DAE4;
    --muted: #A9B4CC;
    --faint: #6B7A9A;
    --line: #1F3260;
    --line-strong: #33497F;

    --accent: #7FB0FF;
    --accent-hover: #9CC2FF;
    --accent-deep: #CFE0FF;
    --accent-fg: #8FBAFF;
    --on-accent: #07122B;
    --accent-soft: #16305F;
    --accent-soft-fg: #A9CAFF;
    --accent-shadow: rgba(0,0,0,0.5);

    --band: #14357C;
    --on-band: #FFFFFF;
    --band-fill: rgba(255,255,255,0.18);

    --fab: #FF8A6B;
    --on-fab: #2A0E06;

    --sidebar: #0A1733;
    --on-sidebar: #FFFFFF;
    --on-sidebar-2: #B8C8E8;
    --sidebar-fill: rgba(255,255,255,0.08);

    --glass: rgba(26,44,88,0.6);
    --glass-edge: rgba(255,255,255,0.16);
    --glass-hi: rgba(255,255,255,0.14);
    --fill: rgba(255,255,255,0.1);
    --shadow: rgba(0,0,0,0.7);
    --scrim: rgba(0,0,0,0.55);

    --danger: #FF8A80;
    --on-danger: #2A0E0E;
    --danger-soft: #4A1C22;
    --warn: #F2C46B;
    --warn-soft: #3D2F10;
    --warn-line: #8A6A1F;
    --good: #6FD8C4;
    --good-soft: #103A38;
    --violet: #C3B2F2;
    --violet-soft: #2A2350;

    --on-colour: #FFFFFF;
    --circle-1: #2470CC;
    --circle-2: #C9442A;
    --circle-3: #7A55D8;
    --circle-4: #0B7A8C;
    --circle-5: #C23B6E;
    --circle-6: #9E6512;
    --circle-7: #4A5FA8;
    --circle-8: #7C6A58;
    --card-1: #1B4FC4;
    --card-2: #C2462B;
    --card-3: #5F45B8;
    --card-4: #0E7489;

    --tag-1: #FFB596; --tag-1-soft: #4A2517;
    --tag-2: #A9CAFF; --tag-2-soft: #16305F;
    --tag-3: #7FE0CF; --tag-3-soft: #0F3B3A;
    --tag-4: #E5CF8E; --tag-4-soft: #3B3113;
    --tag-5: #D3B9EE; --tag-5-soft: #332148;
    --tag-6: #FFA9C6; --tag-6-soft: #4A1A2E;
    --tag-7: #C2CCEA; --tag-7-soft: #252F4D;
    --tag-8: #C2CAD8; --tag-8-soft: #2A3347;
  }
}
/* THEME:END */
/* The page stands on the theme: a field the browser would draw in its own
   white and black takes the theme's colours instead. */
input, textarea, select { background-color: var(--surface); color: var(--ink); }
button { color: inherit; }

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Heebo",Arial,sans-serif; background:var(--field); color:var(--ink); }
.hero { background:linear-gradient(160deg,var(--sidebar),var(--accent)); color:var(--on-accent); padding:34px 20px 30px; }
.hero-inner { max-width:640px; margin:0 auto; }
.logo { display:inline-flex; align-items:center; gap:9px; margin-bottom:18px; }
.logo-tile { width:34px; height:34px; border-radius:9px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17px; color:var(--on-accent); }
.logo-name { font-weight:800; font-size:15px; letter-spacing:0.3px; }
.col-title { font-size:26px; font-weight:800; letter-spacing:-0.5px; line-height:1.25; }
.col-desc { font-size:14px; color:var(--muted); margin-top:8px; line-height:1.6; }
.curator { display:inline-flex; align-items:center; gap:8px; margin-top:14px; background:rgba(255,255,255,0.1); border-radius:20px; padding:6px 14px 6px 8px; font-size:12.5px; }
.curator-avatar { width:24px; height:24px; border-radius:50%; background:var(--warn-line); color:var(--on-accent); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; }
.wrap { max-width:640px; margin:0 auto; padding:20px 16px 120px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; display:flex; gap:13px; align-items:flex-start; }
.thumb { width:52px; height:52px; border-radius:11px; flex-shrink:0; background:var(--field); display:flex; align-items:center; justify-content:center; font-size:24px; background-size:cover; background-position:center; }
.item-name { font-size:15px; font-weight:800; color:var(--ink); }
.item-loc { font-size:12px; color:var(--muted); margin-top:1px; }
.item-tel { display:inline-block; margin-top:6px; font-size:13px; font-weight:700;
  color:var(--accent-fg); background:var(--accent-soft); border:1px solid var(--line); border-radius:14px;
  padding:3px 11px; text-decoration:none; direction:ltr; }
.item-note { font-size:13px; color:var(--ink-2); line-height:1.55; margin-top:6px; }
.item-note b { color:var(--muted); font-weight:700; }
.stars { color:var(--warn); font-size:12px; margin-top:3px; letter-spacing:1px; }
.chip { display:inline-block; font-size:9.5px; font-weight:700; padding:2px 8px; border-radius:9px; margin-top:7px; }
.cta { position:fixed; bottom:0; left:0; right:0; background:linear-gradient(transparent, var(--field) 30%); padding:26px 16px 18px; }
.cta-inner { max-width:640px; margin:0 auto; }
.cta-btn { display:block; width:100%; text-align:center; background:var(--accent); color:var(--on-accent); font-size:15px; font-weight:800; padding:15px; border-radius:14px; text-decoration:none; box-shadow:0 8px 24px var(--accent-shadow); }
.cta-sub { text-align:center; font-size:11.5px; color:var(--muted); margin-top:8px; }
.state { text-align:center; padding:70px 20px; color:var(--muted); font-size:14px; }
.count-line { font-size:11px; font-weight:700; letter-spacing:0.6px; color:var(--muted); margin:4px 0 12px; }
</style>
</head>
<body>
<div class="hero"><div class="hero-inner">
  <div class="logo"><div class="logo-tile">T</div><div class="logo-name">Trustnet</div></div>
  <div class="col-title" id="c-title">Loading list…</div>
  <div class="col-desc" id="c-desc" style="display:none;"></div>
  <div class="curator" id="c-curator" style="display:none;"></div>
</div></div>
<div class="wrap">
  <div class="count-line" id="c-count" style="display:none;"></div>
  <div id="c-items"><div class="state">Loading…</div></div>
</div>
<div class="cta" id="c-cta" style="display:none;"><div class="cta-inner">
  <a class="cta-btn" id="c-save" href="#">Save this list to your Trustnet</a>
  <div class="cta-sub">Free · no password · every item stays credited to the person who recommended it</div>
</div></div>
<script>
var FN_BASE = 'https://kgsdtfrcyjrxeyqqxoic.supabase.co/functions/v1';
var CAT_HUES = {
  dining:{ fg:'var(--tag-1)', bg:'var(--tag-1-soft)' }, travel:{ fg:'var(--tag-2)', bg:'var(--tag-2-soft)' },
  healthcare:{ fg:'var(--tag-6)', bg:'var(--tag-6-soft)' }, home:{ fg:'var(--tag-5)', bg:'var(--tag-5-soft)' },
  culture:{ fg:'var(--tag-4)', bg:'var(--tag-4-soft)' }, hobbies:{ fg:'var(--tag-3)', bg:'var(--tag-3-soft)' },
  professional:{ fg:'var(--tag-8)', bg:'var(--tag-8-soft)' }, other:{ fg:'var(--tag-7)', bg:'var(--tag-7-soft)' }
};
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function catLabel(c) { return c ? c.charAt(0).toUpperCase() + c.slice(1) : ''; }
function render(data) {
  window.__curator = data.curator;
  window.__ownerId = data.owner_id || null;
  document.title = data.title + ' — Trustnet';
  document.getElementById('c-title').textContent = data.title;
  if (data.description) {
    var d = document.getElementById('c-desc');
    d.textContent = data.description; d.style.display = 'block';
  }
  var cu = document.getElementById('c-curator');
  cu.innerHTML = '<span class="curator-avatar">' + esc((data.curator || '?').charAt(0).toUpperCase()) + '</span>'
    + '<span>Curated by <b>' + esc(data.curator) + '</b></span>';
  cu.style.display = 'inline-flex';
  var cl = document.getElementById('c-count');
  cl.textContent = data.count + (data.count === 1 ? ' RECOMMENDATION' : ' RECOMMENDATIONS');
  cl.style.display = 'block';
  var html = '';
  for (var i = 0; i < data.items.length; i++) {
    var it = data.items[i];
    var h = CAT_HUES[it.category] || CAT_HUES.other;
    var h2 = CAT_HUES[it.category] || CAT_HUES.other;
    var letter = String(it.name || '?').trim().charAt(0).toUpperCase() || '?';
    var thumb = it.image_url
      ? '<div class="thumb" style="background-image:url(&quot;' + esc(it.image_url) + '&quot;);"></div>'
      : '<div class="thumb" style="background:' + h2.bg + ';color:' + h2.fg + ';font-weight:800;font-size:22px;">' + esc(letter) + '</div>';
    html += '<div class="card" dir="auto">' + thumb + '<div style="flex:1;min-width:0;">'
      + '<div class="item-name">' + esc(it.name) + '</div>'
      + (it.location ? '<div class="item-loc">' + esc(it.location) + '</div>' : '')
      + (it.phone ? '<a class="item-tel" href="tel:' + esc(it.phone) + '">\u260E ' + esc(it.phone) + '</a>' : '')
      + (it.rating ? '<div class="stars">' + '\u2605\u2605\u2605\u2605\u2605'.slice(0, it.rating) + '</div>' : '')
      + (it.note ? '<div class="item-note"><b>' + esc(data.curator) + ':</b> ' + esc(it.note) + '</div>' : '')
      + (it.category ? '<span class="chip" style="color:' + h.fg + ';background:' + h.bg + ';">' + esc(catLabel(it.category)) + '</span>' : '')
      + '</div></div>';
  }
  document.getElementById('c-items').innerHTML = html || '<div class="state">This list is empty.</div>';
  var token = new URLSearchParams(location.search).get('t') || '';
  var saveBtn = document.getElementById('c-save');
  saveBtn.href = '/?collection=' + encodeURIComponent(token);
  // Session-aware CTA: a signed-in Trustnet user (same origin) sees an
  // "open" verb, not a "sign up" verb — saving stays idempotent either way.
// ── TN SESSION STORE (v0.99.11) ───────────────────────────────────────────
// IDENTICAL in index, respond, collection, connect and confirm;
// session-cookie-sim.js holds the five copies equal and runs them.
// THE SIGN-IN LIVES IN A COOKIE. Measured on dan's iPhone (Chrome and Safari)
// and an Android, 10 Oct 2026, with web/hs-test: an icon added to the home
// screen sees the browser's COOKIES but not its saved data (localStorage),
// where supabase-js keeps the session by default - so every iPhone icon asked
// for a second sign-in. Cookies ONLY, never a cookie and localStorage both:
// refresh tokens rotate, and two copies would drift until one signed the
// other out. Long enough to need splitting, so it is kept in numbered parts.
var TN_SB_KEY = 'sb-kgsdtfrcyjrxeyqqxoic-auth-token';
var TN_COOKIE_PART = 3000;
function tnCookieJar() {
  var jar = {};
  var all = (document.cookie || '').split('; ');
  for (var i = 0; i < all.length; i++) {
    var at = all[i].indexOf('=');
    if (at > 0) jar[all[i].slice(0, at)] = all[i].slice(at + 1);
  }
  return jar;
}
function tnCookieClear(key) {
  var jar = tnCookieJar();
  for (var name in jar) {
    if (name.indexOf(key + '.') === 0) document.cookie = name + '=; path=/; max-age=0; SameSite=Lax; Secure';
  }
}
var tnCookieStorage = {
  getItem: function (key) {
    var jar = tnCookieJar();
    if (jar[key + '.0'] === undefined) return null;
    var enc = '';
    for (var i = 0; jar[key + '.' + i] !== undefined; i++) enc += jar[key + '.' + i];
    try { return decodeURIComponent(enc); } catch (e) { return null; }
  },
  setItem: function (key, value) {
    tnCookieClear(key);
    // Encoded first and split after, so a %XX is never cut in a way that
    // matters: the parts are joined again before anything is decoded.
    var enc = encodeURIComponent(value);
    for (var i = 0, n = 0; i < enc.length; i += TN_COOKIE_PART, n++) {
      document.cookie = key + '.' + n + '=' + enc.slice(i, i + TN_COOKIE_PART)
        + '; path=/; max-age=34560000; SameSite=Lax; Secure';
    }
  },
  removeItem: function (key) { tnCookieClear(key); }
};
// A sign-in saved before v0.99.11 is in localStorage: move it, once, so
// nobody is signed out by the change, and leave no second copy behind.
function tnMoveSessionToCookie() {
  try {
    var old = localStorage.getItem(TN_SB_KEY);
    if (old && tnCookieStorage.getItem(TN_SB_KEY) === null) tnCookieStorage.setItem(TN_SB_KEY, old);
    if (old) localStorage.removeItem(TN_SB_KEY);
  } catch (e) {}
}
// ── END TN SESSION STORE ──────────────────────────────────────────────────
  var viewerId = null;
  // The sign-in is in a cookie since v0.99.11; localStorage only holds one
  // saved before that.
  try {
    var cookieSess = JSON.parse(tnCookieStorage.getItem(TN_SB_KEY) || 'null');
    if (cookieSess && cookieSess.user && cookieSess.user.id) viewerId = cookieSess.user.id;
  } catch (e) {}
  if (!viewerId) try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('sb-') === 0 && k.indexOf('auth-token') > -1) {
        var rawTok = localStorage.getItem(k);
        if (!rawTok) continue;
        try {
          var sess = JSON.parse(rawTok);
          if (sess && sess.user && sess.user.id) { viewerId = sess.user.id; }
          else if (sess && sess.access_token) {
            var payload = JSON.parse(atob(sess.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
            if (payload && payload.sub) viewerId = payload.sub;
          }
        } catch (e2) { viewerId = viewerId || 'unknown'; }
        break;
      }
    }
  } catch (e) { /* storage blocked: keep default CTA */ }
  var sub = document.querySelector('.cta-sub');
  if (viewerId && window.__ownerId && viewerId === window.__ownerId) {
    // The curator on their own page: the useful verb is SHARE, not save
    saveBtn.textContent = 'Copy share link';
    saveBtn.href = '#';
    saveBtn.onclick = function(ev) {
      ev.preventDefault();
      var link = location.origin + '/collection.html?t=' + encodeURIComponent(token);
      var done = function() { saveBtn.textContent = 'Link copied \u2713 \u2014 paste it anywhere'; };
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(link).then(done, done); }
      else { window.prompt('Copy this link:', link); done(); }
    };
    if (sub) sub.textContent = 'This is your list \u2014 anyone with the link can view it, no app needed';
  } else if (viewerId) {
    saveBtn.textContent = 'Open in my Trustnet';
    if (sub) sub.textContent = 'Anything you haven\u2019t saved yet will be added, credited to ' + (window.__curator || 'the curator');
  }
  document.getElementById('c-cta').style.display = 'block';
}
(function() {
  var token = new URLSearchParams(location.search).get('t');
  if (!token) {
    document.getElementById('c-title').textContent = 'List not found';
    document.getElementById('c-items').innerHTML = '<div class="state">This link is missing its list code. Ask for the link again.</div>';
    return;
  }
  fetch(FN_BASE + '/get-collection', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token })
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data && data.title) { render(data); }
    else {
      document.getElementById('c-title').textContent = 'List not found';
      document.getElementById('c-items').innerHTML = '<div class="state">Error: ' + esc((data && data.error) || 'unknown') + '</div>';
    }
  }).catch(function(e) {
    document.getElementById('c-title').textContent = 'Connection problem';
    document.getElementById('c-items').innerHTML = '<div class="state">Could not load the list. Check your connection and refresh.<br>Error: ' + esc(e.message) + '</div>';
  });
})();
</script>
</body>
</html>
