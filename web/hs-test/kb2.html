<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keyboard test 2</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 24px 18px 300px; background: #fff; color: #111; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { font-size: 15px; color: #444; line-height: 1.45; margin: 0 0 8px; }
  label, .lbl { display: block; font-weight: 700; font-size: 15px; margin: 22px 0 6px; }
  textarea, input, .ce { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px; border: 1.5px solid #bbb; border-radius: 12px; font-family: inherit; }
  textarea, .ce { min-height: 80px; }
  .ce:empty::before { content: attr(data-placeholder); color: #888; }
</style>
</head>
<body>
<!-- Which kind of text box, if any, does iOS 26 show WITHOUT its key / card /
     pin bar over the keyboard? dan's iPhone, 2 Nov: the bar shows on every
     plain text box. If one of these comes without it, the question box can be
     built that way. Temporary, like the rest of hs-test. -->
<h1>Keyboard test 2</h1>
<p>Tap each box. For each number, is the key / card / pin bar there or not?</p>

<div class="lbl">A. A writing area that is not a form field</div>
<div class="ce" id="kb-a" contenteditable="true" data-placeholder="Tap here"></div>

<div class="lbl">B. The same, plain text only</div>
<div class="ce" id="kb-b" contenteditable="plaintext-only" data-placeholder="Tap here"></div>

<label for="kb-c">C. A text box with AutoFill, autocorrect and spelling all off</label>
<textarea id="kb-c" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" placeholder="Tap here"></textarea>

<label for="kb-d">D. A search box</label>
<input id="kb-d" type="search" autocomplete="off" placeholder="Tap here">

<form autocomplete="off" onsubmit="return false">
<label for="kb-e">E. A text box inside a form that asks for no AutoFill</label>
<textarea id="kb-e" autocomplete="off" placeholder="Tap here"></textarea>
</form>

<label for="kb-f">F. A text box that says it is a message</label>
<textarea id="kb-f" autocomplete="off" enterkeyhint="send" inputmode="text" name="message" placeholder="Tap here"></textarea>
</body>
</html>
