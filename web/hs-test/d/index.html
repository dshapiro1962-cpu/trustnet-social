<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Test D</title>
<style>*{box-sizing:border-box}body{margin:0;background:#F4F8F5;color:#1C2420;font:17px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}.wrap{max-width:560px;margin:0 auto;padding:22px 16px 40px}h1{font-size:24px;margin:0 0 6px}.sub{color:#56695F;margin:0 0 18px}.box{background:#fff;border:1px solid #DCE7E0;border-radius:14px;padding:16px;margin:0 0 14px}.big{font-size:22px;font-weight:800;padding:16px;border-radius:14px;margin:0 0 14px;text-align:center}.yes{background:#D3E7DC;color:#133D2F}.no{background:#F8D9D2;color:#7A2414}.info{background:#E6EFEA;color:#133D2F}ol{margin:0;padding-left:22px}li{margin:6px 0}code{background:#E9EFEA;padding:2px 6px;border-radius:5px;font-size:15px;word-break:break-all}.small{font-size:14px;color:#56695F}</style>
</head><body><div class="wrap" id="root"></div>
<script>
// TEST D - does a code in the address survive WhatsApp's "Open in Chrome"?
// Test B could not answer that: it writes its code into the address in ANY
// browser, so Chrome would show the code even if the hop had dropped it.
// D makes a UNIQUE code only when opened from the start link (?start=1),
// remembers it in that browser, and in the next browser reports whether the
// same code arrived. Temporary; touches nothing in Trustnet.
(function () {
  var KEY = 'hs-test-d-made';
  var root = document.getElementById('root');
  function el(h) { root.insertAdjacentHTML('beforeend', h); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var ua = navigator.userAgent || '';
  var where = /WhatsApp/i.test(ua) ? "WhatsApp's own browser"
    : /; wv\)/.test(ua) ? 'an app’s built-in browser (not Chrome)'
    : /SamsungBrowser/.test(ua) ? 'Samsung Internet'
    : /Chrome\//.test(ua) ? 'Chrome' : 'another browser';
  var q = new URLSearchParams(location.search);
  var made = null; try { made = localStorage.getItem(KEY); } catch (e) {}
  el('<h1>Test D</h1><p class="sub">Does the code in the address survive the move from WhatsApp to Chrome?</p>');
  el('<div class="box"><b>This page is open in:</b> ' + esc(where) + '</div>');
  if (q.get('start')) {
    var code = Math.random().toString(36).slice(2, 8).toUpperCase();
    try { localStorage.setItem(KEY, code); } catch (e) {}
    history.replaceState(null, '', location.pathname + '?code=' + code);
    el('<div class="big info">Step 1 of 2 — code ' + code + ' made here</div>');
    el('<div class="box"><b>The address now carries:</b><br><code>' + esc(location.pathname + location.search) + '</code></div>');
    el('<div class="box"><b>Now move this page to Chrome:</b><ol>'
      + '<li>Tap <b>⋮</b> (top right).</li>'
      + '<li>Choose <b>Open in Chrome</b> (or <b>Open in browser</b>).</li>'
      + '<li>Photograph what Chrome shows.</li></ol></div>');
  } else if (q.get('code') && made === q.get('code')) {
    el('<div class="big info">Same browser as step 1 — the move has not happened yet</div>');
    el('<div class="box">Tap <b>⋮</b> → <b>Open in Chrome</b>.</div>');
  } else if (q.get('code')) {
    el('<div class="big yes">CODE SURVIVED THE MOVE: ' + esc(q.get('code')) + '</div>');
    el('<div class="box small">Arrived in a different browser (this one never made a code), carrying the code step 1 made.</div>');
  } else {
    el('<div class="big no">ARRIVED WITHOUT THE CODE</div>');
    el('<div class="box small">This page was opened with no code in its address. If you came here with Open in Chrome, the move dropped the code. If you just opened the page directly, start again from the link sent on WhatsApp.</div>');
  }
  el('<div class="box small"><b>Address:</b> <code>' + esc(location.pathname + location.search) + '</code><br><b>Code made in this browser:</b> ' + esc(made || 'none') + '</div>');
  el('<p class="small">' + esc(ua) + '</p>');
})();
</script></body></html>
