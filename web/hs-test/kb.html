<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keyboard test</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 24px 18px; background: #fff; color: #111; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { font-size: 15px; color: #444; line-height: 1.45; margin: 0 0 18px; }
  label { display: block; font-weight: 700; font-size: 14px; margin: 18px 0 6px; }
  textarea, input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px; border: 1.5px solid #bbb; border-radius: 12px; font-family: inherit; }
  textarea { height: 100px; }
</style>
</head>
<body>
<!-- A page with nothing of Trustnet's on it: no app, no theme, no forms
     around the boxes. Does Safari put its key / card / pin bar over the
     keyboard here too? (dan's iPhone, 2 Nov.) Temporary, like the rest of
     hs-test. -->
<h1>Keyboard test</h1>
<p>Nothing of Trustnet is on this page. Tap each box and look above the keyboard: is the key, card and pin bar there?</p>
<label for="kb-1">1. A plain text box</label>
<textarea id="kb-1" placeholder="Tap here"></textarea>
<label for="kb-2">2. The same, asking for no AutoFill</label>
<textarea id="kb-2" autocomplete="off" placeholder="Tap here"></textarea>
<label for="kb-3">3. A one-line box</label>
<input id="kb-3" type="text" placeholder="Tap here">
</body>
</html>
